# Construit le portfolio (Vue 3 + Vite) et le publie sur GitHub Pages
name: Deploy portfolio to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Tant que Pages est réglé sur « Deploy from a branch », GitHub publie aussi la
      # racine du dépôt (le code source, inutilisable) à chaque push. On attend la fin
      # de ce déploiement pour que le site construit (dist) soit publié en dernier.
      # Inutile une fois Settings > Pages > Source réglé sur « GitHub Actions ».
      - name: Wait for the branch-based Pages deployment (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")][0].status // "none"')
            echo "pages-build-deployment: $status"
            if [ "$status" = "completed" ]; then break; fi
            if [ "$status" = "none" ] && [ "$i" -ge 6 ]; then break; fi
            sleep 10
          done
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
